[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "motorcycle-trade-study"
version = "0.1.0"
description = "A notebook-led study of motorcycle trade: evidence, quality, experiments and decisions."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=18,<24",
  "scipy>=1.13,<2", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4",
  "pycountry>=24,<25",
  "jupyterlab>=4.3,<5", "ipykernel>=6.29,<8", "nbformat>=5.10,<6",
  "nbclient>=0.10,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
